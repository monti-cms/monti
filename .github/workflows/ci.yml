# Automated checks. On every push: lint, type check, unused code and package build; tests (Postgres service); the design system's visual regression; and the example app bundle check.
name: CI

# Runs on push only (the PR page shows the result of that commit). Also triggering on PRs would run the same checks twice.
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Check only; nothing is fixed.
      - run: pnpm lint
      # Korean strings in package runtime code live only in the message dictionaries (messages.ts).
      - run: pnpm check:korean
      - run: pnpm check:recipes
      - run: pnpm typecheck
      # Files and exports of the packages that nothing uses, and exports only tests use (a test seam is tagged @internal).
      - run: pnpm knip
      - run: pnpm build

  # The suite is CPU bound (a runner has 4 cores), so it is split by test file over three runners that run at once.
  test-shard:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests create an isolated schema in this DB and drop it when finished (the production DB is not used).
      CMS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run --shard=${{ matrix.shard }}/3

  # One result under the old name, for whatever requires a check called "test".
  test:
    name: test
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = success

  example:
    name: example app (packed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm example:check

  # The design system's catalog in light and dark, compared with the shots under packages/ui/visual/baselines. It runs in Playwright's own Linux
  # image, at the version of the installed @playwright/test (a test checks the tag), because the baselines are made on that image and no other:
  # text is drawn differently per operating system.
  visual:
    name: visual regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @monti-cms/ui build-storybook
      - name: Look for the baselines
        id: baselines
        run: |
          if [ -n "$(find packages/ui/visual/baselines -name '*.png' -print -quit 2>/dev/null)" ]; then
            echo "exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "exist=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No visual baselines yet::Nothing was compared. The shots of this run are in the visual-baselines artifact; commit them to packages/ui/visual/baselines."
          fi
      - name: Compare with the baselines
        if: steps.baselines.outputs.exist == 'true'
        run: pnpm --filter @monti-cms/ui visual:run
      # After a failed comparison, or when there are no baselines yet: the same run again, writing the shots. If the change is meant, the
      # artifact is what goes into packages/ui/visual/baselines (download it and replace the folder).
      - name: Make the baselines this code would have
        if: failure() || steps.baselines.outputs.exist == 'false'
        continue-on-error: true
        run: pnpm --filter @monti-cms/ui visual:run --update-snapshots
        env:
          MONTI_VISUAL_BASELINES: ${{ github.workspace }}/visual-baselines
      - name: Upload the new baselines
        if: failure() || steps.baselines.outputs.exist == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: visual-baselines
          if-no-files-found: ignore
      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            packages/ui/visual/test-results
            packages/ui/visual/report
          if-no-files-found: ignore
