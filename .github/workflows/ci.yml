# Automated checks. On every push: lint (Biome and the core's import rules), the core's tests against the acceptance conditions, and the core's suppression check.
name: CI

# Runs on push only (the PR page shows the result of that commit). Also triggering on PRs would run the same checks twice.
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the step below diffs the pushed commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Check only; nothing is fixed. `pnpm lint`, then the core's tests against docs/acceptance/core (one test per condition, result numbers, no skips,
      # no fake database, no suppression comment).
      - run: node agent-guard/check.mjs
      # The core is fixed, not silenced: the pushed commits add no `biome-ignore`, `@ts-expect-error`, `@ts-nocheck` or `eslint-disable` under
      # packages/core. A new branch (an all-zero `before`) or a `before` that is gone (after a force push) is compared with where it left main.
      - name: no new suppression in the core
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$GITHUB_SHA" 2>/dev/null || git rev-list --max-parents=0 "$GITHUB_SHA" | tail -n 1)
          fi
          if git diff -U0 "$base" "$GITHUB_SHA" -- packages/core | grep -E '^\+' | grep -vE '^\+\+\+ ' | grep -E 'biome-ignore|@ts-expect-error|@ts-nocheck|eslint-disable'; then
            echo "::error::A suppression was added under packages/core: fix the code instead."
            exit 1
          fi
