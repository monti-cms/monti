# Automated checks. On every push: lint, type check, unused code and package build; and the example app bundle check.
name: CI

# Runs on push only (the PR page shows the result of that commit). Also triggering on PRs would run the same checks twice.
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The integration branch that feature branches are cut from and merged into. `check:migrations` compares with it. It becomes `main` once the
  # overhaul merges.
  MONTI_BASE_BRANCH: overhaul

jobs:
  check:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history, for `check:migrations` to reach its base (the merge base with the integration branch, or the commit before the push).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Check only; nothing is fixed.
      - run: pnpm lint
      # Korean strings in package runtime code live only in the message dictionaries (messages.ts).
      - run: pnpm check:korean
      # Admin UI is styled with token utilities and built from the parts of @monti-cms/ui (no one-off CSS, raw pixel sizes or parts built in a screen).
      - run: pnpm check:design
      # The token files are what scripts/gen-tokens.mjs writes from tokens.json, and the tokens keep the design system's rules (text contrast, one
      # declaration per role).
      - run: pnpm gen:tokens --check
      # The message dictionaries: one file naming convention, the same keys in English and Korean, and no key that nothing uses.
      - run: pnpm check:messages
      # A migration step on the base branch is not renamed or deleted, and the step list is the step files (a store records steps by name).
      - run: pnpm check:migrations
        env:
          MONTI_PUSH_BEFORE: ${{ github.event.before }}
      - run: pnpm typecheck
      # Files and exports of the packages that nothing uses.
      - run: pnpm knip
      - run: pnpm build

  example:
    name: example app (packed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm example:check
