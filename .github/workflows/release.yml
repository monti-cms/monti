# The release (docs/design/features/20-release.md). Pushing a `v*` tag checks the version, builds the packages, proves them (a fresh Next app
# installs the packed tarballs and runs; publint and arethetypeswrong pass on every tarball), and makes a GitHub release that holds one tarball
# for each package and the lines a site installs them by: a draft until every tarball is up. Nothing goes to npm: the packages stay `private` until that is decided.
#
# This job's token can write to the repository (it makes the release), so each action is named by its commit, with the version that commit is
# as a note: a tag can be moved to other code, a commit cannot. And a tag releases only a commit that is on the release branch: a `v*` tag
# pushed on any other commit stops here, before anything is built.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The branch releases are made from.
  RELEASE_BRANCH: main

jobs:
  release:
    name: check · prove · release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monti_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history: the next step asks whether the tag's commit is on the release branch.
          fetch-depth: 0
      - name: Check that the tag's commit is on the release branch
        run: |
          git fetch --no-tags origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "The tag $GITHUB_REF_NAME names $GITHUB_SHA, which is not on $RELEASE_BRANCH: a release is made from $RELEASE_BRANCH only."
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stop if the tag and the packages' version differ (`node scripts/version.mjs <version>` sets every package at once).
      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in packages/*/package.json; do
            actual=$(node -p "require('./$file').version")
            if [ "$actual" != "$version" ]; then
              echo "$file: version $actual does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: pnpm build
      # The gates. Each stops the release.
      - run: pnpm check:packages
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/try-release.mjs --shot "$RUNNER_TEMP/release-proof/admin.png"
        env:
          CMS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/monti_test
      # The bundle a site installs from: its packages name each other by this release's own address.
      - run: node scripts/pack-release.mjs "$RUNNER_TEMP/release" --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
      # A draft first, so that an upload that fails leaves nothing a person can install from. A second run of this job finds the draft and
      # goes on with it; a release that is out already is never touched.
      - name: Draft the GitHub release and upload the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a tag after it (0.2.0-next.17) is a trial release.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "The release $GITHUB_REF_NAME is out already."
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release/README.md"
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "Monti ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release/README.md" \
              $prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/*.tgz --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
