# 배포 묶음. `v*` 태그를 올리면 패키지를 빌드·묶어 `release` 브랜치에 커밋하고 `release/<태그>` 태그를 붙인다.
# 공개 전에는 npm 대신 이 태그를 GitHub 주소로 설치한다(`scripts/pack-release.mjs`).
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build · pack · push release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 태그와 패키지 버전이 다르면 멈춘다(`scripts/version.mjs`로 맞춘다).
      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in packages/*/package.json; do
            actual=$(node -p "require('./$file').version")
            if [ "$actual" != "$version" ]; then
              echo "$file: version $actual does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: pnpm build
      - run: node scripts/pack-release.mjs "$RUNNER_TEMP/release"
      - name: Commit to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_sha=$(git rev-parse HEAD)
          # 배포 브랜치가 있으면 그 위에, 없으면 기록 없는 새 브랜치로 시작한다.
          if git fetch --depth=1 origin release; then
            git worktree add "$RUNNER_TEMP/branch" FETCH_HEAD
            git -C "$RUNNER_TEMP/branch" switch -c release
          else
            git worktree add --orphan -b release "$RUNNER_TEMP/branch"
          fi
          cd "$RUNNER_TEMP/branch"
          git rm -rq --ignore-unmatch .
          cp -R "$RUNNER_TEMP/release/." .
          git add -A
          git commit -q -m "$GITHUB_REF_NAME 배포 묶음" -m "소스: $source_sha"
          git tag "release/$GITHUB_REF_NAME"
          git push origin release "release/$GITHUB_REF_NAME"
